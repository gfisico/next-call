name: deploy

# main への push で 品質ゲート → イメージビルド/push → VPS デプロイ を連鎖させる。
# deploy ジョブは vars.DEPLOY_ENABLED == 'true' のときのみ実行する。
# 未設定（フォーク・Secrets 未整備）では quality と image のみ通り、CI は赤くならない。
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # GHCR のイメージ名（owner は小文字化して image ジョブで確定する）。
  IMAGE_NAME: next-call

jobs:
  quality:
    name: quality (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  image:
    name: build & push image (GHCR)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image ref
        id: meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER_LC}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_sha=ghcr.io/${OWNER_LC}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    # VPS 側でイメージの取得が止まっても、後続のデプロイを待たせ続けないように上限を置く
    timeout-minutes: 15
    # Secrets/vars 未設定時はスキップ（有効な GitHub Actions 式）。
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      # デプロイ用の鍵（VPS_DEPLOY_KEY）は、VPS 側で scripts/vps/deploy-next-call.sh しか動かせない。
      # VPS のホスト鍵（ed25519 の公開鍵）を固定して確かめる（ランナーは毎回 known_hosts が空のため）。
      # VPS のホスト鍵を作り直したら VPS_HOST_KEY を直す
      - name: Set up SSH
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIYI/qhiDvPF39s10FtBVvcXBIRxfr1TWGkqRq8jLrVm
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "next-call-vps $VPS_HOST_KEY" > ~/.ssh/known_hosts_vps
          {
            echo "Host vps"
            echo "  HostName $VPS_HOST"
            echo "  User root"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  HostKeyAlias next-call-vps"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts_vps"
            echo "  HostKeyAlgorithms ssh-ed25519"
            echo "  StrictHostKeyChecking yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # 直近 SHA のイメージを明示して pull/up（ロールバックの起点を一意にする）。手順は VPS のスクリプトが行う
      - name: Deploy over SSH
        env:
          DEPLOY_IMAGE: ${{ needs.image.outputs.image_sha }}
        run: |
          if ! [[ "$DEPLOY_IMAGE" =~ ^ghcr\.io/gfisico/next-call:[0-9a-f]{40}$ ]]; then
            echo "イメージの名前が想定の形ではありません: $DEPLOY_IMAGE"
            exit 1
          fi
          ssh vps "deploy $DEPLOY_IMAGE"
